name: CI Test & Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Verify MoonBit Version
        run: |
          export PATH="$HOME/.moon/bin:$PATH"
          moon version

      - name: Update Dependencies
        run: |
          export PATH="$HOME/.moon/bin:$PATH"
          moon update

      - name: Check Code Formatting
        run: |
          export PATH="$HOME/.moon/bin:$PATH"
          moon fmt --check

      - name: Check Package Interface
        run: |
          export PATH="$HOME/.moon/bin:$PATH"
          moon info

      - name: Run Test Suite
        run: |
          export PATH="$HOME/.moon/bin:$PATH"
          moon test

      - name: Execute Main Integration Demo
        run: |
          export PATH="$HOME/.moon/bin:$PATH"
          moon run src/main
