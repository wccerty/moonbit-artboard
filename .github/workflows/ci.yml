name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install current stable MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: moon version --all

      - name: Resolve dependencies
        run: moon update

      - name: Check formatting
        run: moon fmt --check

      - name: Check generated interfaces
        run: |
          moon info
          git diff --exit-code -- '*.mbti'

      - name: Check packages
        run: moon check --deny-warn

      - name: Run tests
        run: moon test --target wasm-gc --deny-warn

      - name: Run integration showcase
        run: moon run src/main --target wasm-gc

  native:
    name: Native verification
    runs-on: ubuntu-latest
    needs: check
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install current stable MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: moon version --all

      - name: Resolve dependencies
        run: moon update

      - name: Run native tests
        run: moon test --target native --deny-warn

      - name: Run native benchmark
        run: moon run cmd/bench --target native
